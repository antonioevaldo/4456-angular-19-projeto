<h3 class="titulo">
  {{ periodoComTransacoes()[0] | titlecase }}
</h3>

<hr class="divisoria">

<ul class="transacoes">
  @for (transacao of periodoComTransacoes()[1]; track transacao.id) {
    <li>
      <app-transacao [transacao]="transacao" />
    </li>
  } @empty {
    <li aria-hidden="true">
      Ainda não há transações.
    </li>
  }
</ul>
