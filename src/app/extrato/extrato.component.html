<aside class="extrato">
  <h2 class="titulo">Extrato</h2>

  <ul class="transacoes">
    @for (transacao of transacoes(); track transacao.id) {
      <li class="transacao">
        <span class="valor">{{ transacao.valor | currency:'BRL' }}</span>
        <span class="data">23/11/2022</span>
      </li>
      {{ transacao.id }}
    }
  </ul>
</aside>
