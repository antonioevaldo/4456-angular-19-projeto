<aside class="extrato">
  <h2 class="titulo">Extrato</h2>

  <ul class="transacoes">
    @for (transacao of transacoes(); track transacao.id) {
      <li class="transacao">
        <span class="valor">
          {{ transacao.tipo === "saque" ? '-' : '' }}{{ transacao.valor | currency:'BRL' }}
        </span>
        <span class="data">
          {{ transacao.data | date:'dd/MM/yyyy' }}
        </span>
      </li>
    }
  </ul>
</aside>
