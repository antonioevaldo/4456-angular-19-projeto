<header class="banner">
  <section class="boas-vindas">
    <span class="boas-vindas__data">
      {{ dataAtual | date:'EEEE, dd/MM/yyyy' | titlecase }}
    </span>
    <h1 class="boas-vindas__titulo">Olá, Evaldo! :)</h1>
  </section>

  <section class="saldo">
    <h2 class="saldo__titulo">Saldo</h2>
    <div class="saldo__divisoria"></div>
    <span class="saldo__tipo-conta">Conta corrente</span>
    <span class="saldo__valor">{{ saldo() | currency:'BRL' }}</span>
  </section>
</header>
